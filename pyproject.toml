[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rise-mode-vision02"
version = "1.0.0"
description = "Controlador experimental Linux para Rise Mode Vision 02 USB HID"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.2", "PyYAML>=6.0,<7"]

[project.scripts]
vision02 = "vision02.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
wayland = ["dbus-next>=0.2.3,<1"]
dev = [
    "pytest>=8",
    ]
